[project]
name = "pypalettes"
version = "0.2.1"
description = "A dependency-free large (+2500) collection of colormaps and palettes for Python."
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE.note"]
authors = [
  { name = "Joseph Barbier", email = "joseph.barbierdarnal@gmail.com" },
]
keywords = ["altair", "bokeh", "cmap", "colormap", "dataviz", "matplotlib", "palette", "plotly", "seaborn", "visualization"]
classifiers = ["Framework :: Matplotlib", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Programming Language :: Python :: 3"]
dependencies = []

[project.urls]
Documentation = "https://python-graph-gallery.com/introduction-to-pypalettes/"
Homepage = "https://python-graph-gallery.com/color-palette-finder/"
Issues = "https://github.com/y-sunflower/pypalettes/issues"
Repository = "https://github.com/y-sunflower/pypalettes"

[dependency-groups]
dev = [
  "bs4>=0.0.2",
  "coverage>=7.9.1",
  "genbadge[coverage]>=1.1.2",
  "mkdocs-material>=9.6.9",
  "mkdocs-matplotlib>=0.10.1",
  "mkdocstrings-python>=1.16.5",
  "pandas>=2.2.3",
  "plotnine>=0.14.6",
  "pre-commit>=4.2.0",
  "pyrefly>=1.3.2",
  "pytest>=8.3.5",
  "ruff>=0.11.13",
  "seaborn>=0.13.2",
  "ty>=0.0.1a25",
]

[build-system]
requires = [
  "setuptools",
  "setuptools-scm",
]
build-backend = "setuptools.build_meta"

[tool.piecheck]
max-file-size-mb = 1.5
ignore-undeclared-dependencies = ["matplotlib", "PIL"]

[tool.ruff]
extend-exclude = ["parsers"]

[tool.setuptools]
packages = ["pypalettes"]
include-package-data = true

[tool.ty.src]
exclude = ["tests"]

[tool.uv.sources]
pypalettes = { workspace = true }
